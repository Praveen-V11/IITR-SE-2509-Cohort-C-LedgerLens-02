version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LEDGERLENS_VISION_MODEL=${LEDGERLENS_VISION_MODEL:-gpt-4o}
      - LEDGERLENS_REVIEW_THRESHOLD=${LEDGERLENS_REVIEW_THRESHOLD:-0.75}
      - LEDGERLENS_DB_URL=sqlite:////srv/ledgerlens/data/ledgerlens.db
      - LEDGERLENS_UPLOAD_DIR=/srv/ledgerlens/uploads
    volumes:
      - ledgerlens_data:/srv/ledgerlens/data
      - ledgerlens_uploads:/srv/ledgerlens/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - LEDGERLENS_API_BASE=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  ledgerlens_data:
  ledgerlens_uploads:
